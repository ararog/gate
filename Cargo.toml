[package]
name = "rt-gate"
version = "0.1.3"
edition = "2021"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/ararog/gate"
homepage = "https://github.com/ararog/gate"
description = "A tiny wrapper for async runtimes."
readme = "README.md"
license = "MIT"
keywords = ["tasks", "async", "runtime", "wrapper"]
publish = true
rust-version = "1.64.0"

[features]
default = ["compio-rt"]

smol-rt = ["dep:smol"]
tokio-rt = ["dep:tokio"]
compio-rt = ["compio/runtime", "dep:compio-runtime"]

[dependencies]
compio = { version = "0.18.0", optional = true, default-features = false }
compio-runtime = { version = "0.11.0", optional = true, default-features = false }
smol = { version = "2.0.2", optional = true, default-features = false }
tokio = { version = "1.50.0", features = ["rt-multi-thread"], default-features = false, optional = true }
